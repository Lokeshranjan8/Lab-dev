services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labscholar}
      POSTGRES_USER: ${POSTGRES_USER:-labscholar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-labscholar}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-labscholar}
      ADMIN_KEY: ${ADMIN_KEY:?Set ADMIN_KEY in .env}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    command: ["sh", "-c", "npm run db:init && npm start"]
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - uploads-data:/app/uploads
      - ./server.js:/app/server.js:ro
      - ./public:/app/public:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  uploads-data:
